apply plugin: 'com.android.application'

ext {
    ndkVersion = '25.1.8937393'
}

android {
    namespace "com.gidi.bio_pcr"

    signingConfigs {
        debug {
            storeFile file('./keystore/debug.keystore')
            storePassword 'android'
            keyAlias = 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileSdkVersion 34
    buildToolsVersion = '35.0.0'
    defaultConfig {
        applicationId "com.gidi.bio_pcr.pipeline_slan"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 202600625
        versionName "V5.0.0_20260625"//"V5.0.0_slan_autopipeline_20251010" ///加入ack的log调试
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    ndkVersion ndkVersion

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    packagingOptions {

        pickFirst 'lib/arm64-v8a/liberrno-lib.so'
        pickFirst 'lib/arm64-v8a/libusb-lib.so'
        pickFirst 'lib/arm64-v7a/liberrno-lib.so'
        pickFirst 'lib/arm64-v7a/libusb-lib.so'
        pickFirst 'lib/armeabi-v7a/liberrno-lib.so'
        pickFirst 'lib/armeabi-v7a/libusb-lib.so'
        pickFirst 'lib/x86/liberrno-lib.so'
        pickFirst 'lib/x86/libusb-lib.so'
        pickFirst 'lib/x86_64/liberrno-lib.so'
        pickFirst 'lib/x86_64/libusb-lib.so'
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 启用BuildConfig生成
            debuggable true
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures{
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation files('libs/slansdk V1.0.1 20240722.aar')
    implementation project(path: ':SerialPortLibrary')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
